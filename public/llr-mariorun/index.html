<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>老师大冒险 · SM63 Redux Web</title>
    <link rel="stylesheet" href="/llr-mariorun/game.css" />
  </head>
  <body>
    <main class="redux-shell">
      <section class="redux-hero" aria-label="游戏启动器">
        <div class="redux-copy">
          <p class="eyebrow">LLR MARIO RUN · GODOT WEB EDITION</p>
          <h1>老师大冒险</h1>
          <p class="lead">基于完整 Godot Web 游戏壳运行，后台可上传素材包和 PCK。手机端叠加虚拟按键，竖屏浏览器也按横屏舞台显示。</p>
          <div class="redux-actions">
            <button id="focus-game" class="primary-button" type="button">点我开始 / 聚焦游戏</button>
            <a class="secondary-button" href="/admin">管理员素材库</a>
          </div>
        </div>
        <aside class="redux-card" aria-label="操作提示">
          <strong>电脑键位</strong>
          <span>方向键 / WASD 移动</span>
          <span>↑ 跳跃，X 旋转，Z 砸地 / 交互</span>
          <span>C / 空格 使用喷水背包</span>
          <span>后台上传的 <code>game.bundle.pck</code> 会优先作为游戏包加载。</span>
        </aside>
      </section>

      <section class="prelaunch-panel" aria-label="开始前选择">
        <div>
          <p class="eyebrow">开始前选择</p>
          <h2>选择素材包和关卡</h2>
          <p>素材包会决定后台上传的 PCK 是否覆盖默认游戏包；关卡选择会记录在启动参数和状态栏，方便对照后台关卡编辑。</p>
        </div>
        <label>
          <span>素材包</span>
          <select id="pack-select"></select>
        </label>
        <label>
          <span>关卡</span>
          <select id="level-select"></select>
        </label>
        <div class="launch-buttons">
          <button id="start-selected-game" class="primary-button" type="button">开始完整游戏</button>
        </div>
      </section>

      <section class="game-frame-shell" aria-label="SM63 Redux 游戏窗口">
        <iframe
          id="godot-frame"
          class="godot-frame"
          title="SM63 Redux Web Game"
          src="about:blank"
          data-game-src="/llr-mariorun/godot/index.html"
          allow="autoplay; fullscreen; gamepad"
          allowfullscreen
        ></iframe>

        <div class="frame-toolbar">
          <span id="frame-status">正在加载 Godot 游戏…</span>
          <button id="reload-game" type="button">重载</button>
          <button id="fullscreen-game" type="button">横屏全屏</button>
        </div>

        <div class="virtual-controls" aria-label="手机虚拟按键">
          <div class="virtual-joystick" data-joystick aria-label="移动摇杆">
            <span class="joystick-knob" aria-hidden="true"></span>
          </div>
          <div class="virtual-actions">
            <button data-key="ArrowUp" type="button">跳跃</button>
            <button data-key="KeyX" type="button">旋转</button>
            <button data-key="KeyC" type="button">喷水</button>
            <button data-key="KeyZ" type="button">砸地</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/llr-mariorun/launcher.js"></script>
  </body>
</html>
